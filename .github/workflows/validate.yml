name: Validate Focus On Study
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check tests/smoke.cjs
      - name: Run application smoke tests
        run: node tests/smoke.cjs
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.webmanifest
          test -s sw.js
          test -s icon.svg
          test -s tests/smoke.cjs
      - name: Validate manifest and app references
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html
          grep -q 'manifest.webmanifest' index.html
